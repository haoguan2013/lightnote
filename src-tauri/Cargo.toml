[package]
name = "light-notes"
version = "1.11.1"
description = "轻记 - 四码 PIN 锁屏笔记应用"
authors = [""]
edition = "2021"

[lib]
name = "light_notes_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
